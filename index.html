<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #b8b8b6; -webkit-font-smoothing: none; }
  a { color: #000; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  .px { font-family: 'Pixelify Sans', sans-serif; }
  .ss { font-family: 'Silkscreen', monospace; }
  button { font: inherit; }
  @keyframes sofia-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sofia-fade { animation: none !important; }
  }
  @media (max-width: 768px) {
    html, body { overflow-x: hidden; }
  }
  @media (max-width: 480px) {
    .sofia-menu-bar { padding: 0 6px !important; }
    .sofia-menu-bar button { padding: 4px 7px !important; font-size: 12px !important; }
  }
</style>
</helmet>

<div style="position:relative;width:100%;height:100vh;overflow:hidden;background:#b8b8b6;font-family:'Work Sans',Helvetica,Arial,sans-serif;">

  <sc-if value="{{ showWelcome }}" hint-placeholder-val="{{ true }}">
    <div class="sofia-fade" role="button" tabindex="0" aria-label="Dismiss welcome screen" onClick="{{ dismissWelcome }}" onKeyDown="{{ handleWelcomeKey }}" style="position:fixed;inset:0;background:#eceae7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:9999;cursor:pointer;animation:sofia-fade-in .4s ease;">
      <svg width="76" height="70" viewBox="0 0 76 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="4" width="46" height="42" rx="4" stroke="#000" stroke-width="2" fill="#fff"></rect>
        <rect x="21" y="10" width="34" height="26" rx="1" stroke="#000" stroke-width="2" fill="#fff"></rect>
        <circle cx="32" cy="20" r="1.7" fill="#000"></circle>
        <circle cx="44" cy="20" r="1.7" fill="#000"></circle>
        <path d="M29 27 Q38 32 47 27" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"></path>
        <rect x="32" y="46" width="12" height="6" fill="#000"></rect>
        <rect x="17" y="53" width="42" height="4" rx="1" fill="#000"></rect>
      </svg>
      <div class="ss" style="font-size:15px;letter-spacing:.3px;">Welcome to Sofia OS...</div>
    </div>
  </sc-if>

  <sc-if value="{{ showDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;">

      <div class="px" style="height:26px;background:#fff;border-bottom:2px solid #000;display:flex;align-items:center;padding:0 10px;font-weight:600;font-size:14px;position:relative;z-index:800;">
        <div style="width:13px;height:13px;background:#000;border-radius:3px;margin-right:16px;flex:none;"></div>
        <sc-for list="{{ menus }}" as="menu" hint-placeholder-count="5">
          <div style="position:relative;">
            <button onClick="{{ menu.toggle }}" class="px" style="{{ menu.btnStyle }}">{{ menu.label }}</button>
            <sc-if value="{{ menu.open }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;top:24px;left:0;min-width:220px;background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000;z-index:850;padding:5px 0;">
                <sc-for list="{{ menu.items }}" as="item" hint-placeholder-count="3">
                  <sc-if value="{{ item.sep }}" hint-placeholder-val="{{ false }}">
                    <div style="border-top:1px solid #000;margin:5px 10px;"></div>
                  </sc-if>
                  <sc-if value="{{ item.isLink }}" hint-placeholder-val="{{ false }}">
                    <a href="{{ item.href }}" target="{{ item.target }}" rel="{{ item.rel }}" download="{{ item.download }}" style="{{ item.itemStyle }}">{{ item.label }}</a>
                  </sc-if>
                  <sc-if value="{{ item.isButton }}" hint-placeholder-val="{{ false }}">
                    <button onClick="{{ item.action }}" disabled="{{ item.disabled }}" style="margin:0;box-sizing:border-box;appearance:none;-webkit-appearance:none;{{ item.itemStyle }}font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed;">{{ item.label }}</button>
                  </sc-if>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <span class="ss" style="margin-left:auto;font-size:11px;">SOFIA OS</span>
      </div>

      <div style="position:absolute;inset:26px 0 0 0;" onClick="{{ closeMenus }}">

<sc-if value="{{ showDesktopIcons }}" hint-placeholder-val="{{ true }}">
        <div style="position:absolute;left:{{ folderX }}px;top:{{ folderY }}px;width:100px;text-align:center;cursor:grab;user-select:none;" onMouseDown="{{ startDragFolder }}" onClick="{{ openPortfolio }}">
          <svg width="58" height="42" viewBox="0 0 58 42" style="margin:0 auto;display:block;image-rendering:pixelated;">
            <rect x="1" y="9" width="56" height="31" fill="#fff" stroke="#000" stroke-width="2"></rect>
            <path d="M1 9V4h20l4 5" fill="#fff" stroke="#000" stroke-width="2"></path>
            <line x1="1" y1="16" x2="57" y2="16" stroke="#000" stroke-width="1"></line>
          </svg>
          <div class="ss" style="font-size:9.5px;margin-top:4px;color:#000;background:#b8b8b6;">MY PORTFOLIO</div>
        </div>

        <div id="sofia-os-trash" style="position:absolute;right:40px;bottom:40px;width:70px;text-align:center;cursor:pointer;user-select:none;" onClick="{{ openTrash }}">
          <div style="{{ trashBoxStyle }}">
            <svg width="36" height="40" viewBox="0 0 36 40" style="image-rendering:pixelated;">
              <rect x="3" y="9" width="30" height="27" fill="#fff" stroke="#000" stroke-width="2"></rect>
              <line x1="8" y1="14" x2="8" y2="31" stroke="#000" stroke-width="1.4"></line>
              <line x1="14" y1="14" x2="14" y2="31" stroke="#000" stroke-width="1.4"></line>
              <line x1="21" y1="14" x2="21" y2="31" stroke="#000" stroke-width="1.4"></line>
              <line x1="27" y1="14" x2="27" y2="31" stroke="#000" stroke-width="1.4"></line>
              <path d="M0 9h36" stroke="#000" stroke-width="2"></path>
              <path d="M11 9V4h13v5" fill="none" stroke="#000" stroke-width="2"></path>
            </svg>
          </div>
          <div class="ss" style="font-size:9.5px;margin-top:4px;color:#000;">Trash</div>
        </div>
        </sc-if>

        <sc-if value="{{ portfolioOpen }}" hint-placeholder-val="{{ false }}">
          <div onMouseDown="{{ focusPortfolio }}" style="{{ portfolioWinStyle }}">
            <div ref="{{ portfolioScrollRef }}" style="flex:1;overflow:auto;background:#fff;">
              <dc-import name="Portfolio" on-close-portfolio="{{ closePortfolio }}" hint-size="1200px,1600px"></dc-import>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ trashOpen }}" hint-placeholder-val="{{ false }}">
          <div onMouseDown="{{ focusTrash }}" style="{{ trashWinStyle }}">
            <div class="px" style="height:26px;border-bottom:2px solid #000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none;">
              <span style="font-size:14px;font-weight:600;">Trash</span>
              <button onClick="{{ closeTrash }}" aria-label="Close window" style="position:absolute;left:6px;top:2px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;padding:0;cursor:pointer;"><span style="width:13px;height:13px;border:2px solid #fff;background:#000;display:block;"></span></button>
            </div>
            <div class="px" style="height:22px;border-bottom:2px solid #000;display:flex;align-items:center;font-size:12px;">
              <span style="flex:1;padding-left:12px;">0 items</span>
              <span style="flex:1;text-align:right;padding-right:12px;">0K in disk</span>
            </div>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px;">
              Trash is empty.
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ cvOpen }}" hint-placeholder-val="{{ false }}">
          <div onMouseDown="{{ focusCV }}" style="{{ cvWinStyle }}">
            <div class="px" style="height:26px;border-bottom:2px solid #000;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none;">
              <span style="font-size:14px;font-weight:600;">CV</span>
              <button onClick="{{ closeCV }}" aria-label="Close window" style="position:absolute;left:6px;top:2px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;padding:0;cursor:pointer;"><span style="width:13px;height:13px;border:2px solid #fff;background:#000;display:block;"></span></button>
            </div>
            <div style="flex:1;overflow:auto;background:#fff;padding:32px;">
              <div class="ss" style="font-size:11px;color:#555;">CV</div>
              <h2 style="margin:14px 0 0;font-weight:700;font-size:22px;">Sofia Flores, Product Designer</h2>
              <p style="margin:16px 0 0;font-size:15px;line-height:1.6;color:#333;max-width:440px;">[ ADD CV CONTENT: attach a PDF or paste a resume summary here. ]</p>
              <button disabled="" title="Add a CV file to enable download" class="px" style="margin-top:26px;border:2px solid #000;border-radius:12px;background:#000;color:#fff;padding:10px 20px;font-weight:700;font-size:14px;opacity:.45;cursor:not-allowed;">Download CV</button>
            </div>
          </div>
        </sc-if>


      </div>

      <sc-if value="{{ alertOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:9500;display:flex;align-items:center;justify-content:center;">
          <div style="width:320px;border:2px solid #000;background:#fff;box-shadow:6px 6px 0 #000;">
            <div style="height:22px;background:#000;border-bottom:2px solid #000;"></div>
            <div style="padding:22px 20px;">
              <p class="ss" style="margin:0;font-size:12px;line-height:1.7;">This item can't be moved to the Trash.</p>
              <p class="ss" style="margin:12px 0 0;font-size:12px;line-height:1.7;">Sofia worked too hard on it.</p>
              <button ref="{{ alertOkRef }}" onClick="{{ closeAlert }}" class="px" style="margin-top:20px;border:2px solid #000;background:#fff;padding:8px 22px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 #000;">OK
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    stage: 'welcome',
    openMenu: null,
    folder: { x: 60, y: 40 },
    trashHover: false,
    windows: {
      portfolio: { open: false, z: 1 },
      cv: { open: false, z: 1 },
      trash: { open: false, z: 1 }
    },
    zTop: 1,
    alertOpen: false,
    patternIndex: 0,
    strokeWidth: 2
  };

  constructor(props) {
    super(props);
    this.portfolioScrollRef = React.createRef();
    this.alertOkRef = React.createRef();
  }

  componentDidMount() {
    this.reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let shown = false;
    try { shown = sessionStorage.getItem('sofiaOS_welcomeShown') === '1'; } catch (e) {}
    if (shown) {
      this.setState({ stage: 'desktop' });
    } else {
      const delay = this.reducedMotion ? 0 : 1500;
      this._welcomeTimer = setTimeout(() => this.dismissWelcome(), delay);
    }
    this._keyHandler = (e) => {
      if (this.state.stage === 'welcome' && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) {
        e.preventDefault();
        this.dismissWelcome();
      }
      if (this.state.alertOpen && (e.key === 'Enter' || e.key === 'Escape')) {
        this.closeAlert();
        return;
      }
      if (e.key === 'Escape') {
        const w = this.state.windows;
        const candidates = ['cv', 'trash'].filter((k) => w[k].open);
        if (candidates.length) {
          candidates.sort((a, b) => w[b].z - w[a].z);
          this.closeWindow(candidates[0]);
        }
      }
    };
    document.addEventListener('keydown', this._keyHandler);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this._keyHandler);
    if (this._welcomeTimer) clearTimeout(this._welcomeTimer);
    if (this._onMove) document.removeEventListener('mousemove', this._onMove);
    if (this._onUp) document.removeEventListener('mouseup', this._onUp);
  }

  componentDidUpdate(prevProps, prevState) {
    if (this.state.alertOpen && !prevState.alertOpen && this.alertOkRef.current) {
      this.alertOkRef.current.focus();
    }
  }



  dismissWelcome = () => {
    if (this.state.stage !== 'welcome') return;
    try { sessionStorage.setItem('sofiaOS_welcomeShown', '1'); } catch (e) {}
    if (this._welcomeTimer) clearTimeout(this._welcomeTimer);
    this.setState({ stage: 'desktop' });
  };

  handleWelcomeKey = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.dismissWelcome(); }
  };

  toggleMenu = (key) => {
    this.setState((s) => ({ openMenu: s.openMenu === key ? null : key }));
  };

  closeMenus = () => this.setState({ openMenu: null });

  openWindow = (key) => {
    this.setState((s) => {
      const z = s.zTop + 1;
      return { windows: { ...s.windows, [key]: { open: true, z } }, zTop: z, openMenu: null };
    });
  };

  closeWindow = (key) => {
    this.setState((s) => ({ windows: { ...s.windows, [key]: { ...s.windows[key], open: false } } }));
  };

  focusWindow = (key) => {
    this.setState((s) => {
      const z = s.zTop + 1;
      return { windows: { ...s.windows, [key]: { ...s.windows[key], z } }, zTop: z };
    });
  };

  openPortfolio = () => { window.location.href = 'portfolio.html'; };
  closePortfolio = () => this.closeWindow('portfolio');
  focusPortfolio = () => this.focusWindow('portfolio');

  openCV = () => this.openWindow('cv');
  closeCV = () => this.closeWindow('cv');
  focusCV = () => this.focusWindow('cv');


  openTrash = () => this.openWindow('trash');
  closeTrash = () => this.closeWindow('trash');
  focusTrash = () => this.focusWindow('trash');

  goSection = (id) => { window.location.href = 'portfolio.html#' + id; };

  startDragFolder = (e) => {
    e.preventDefault();
    this._dragOrig = { ...this.state.folder };
    this._dragStart = { x: e.clientX, y: e.clientY };
    this._onMove = (ev) => this.onDragFolderMove(ev);
    this._onUp = (ev) => this.onDragFolderUp(ev);
    document.addEventListener('mousemove', this._onMove);
    document.addEventListener('mouseup', this._onUp);
  };

  onDragFolderMove = (ev) => {
    const dx = ev.clientX - this._dragStart.x;
    const dy = ev.clientY - this._dragStart.y;
    let nx = this._dragOrig.x + dx;
    let ny = this._dragOrig.y + dy;
    const maxX = Math.max(16, window.innerWidth - 120);
    const maxY = Math.max(16, window.innerHeight - 140);
    nx = Math.max(16, Math.min(nx, maxX));
    ny = Math.max(16, Math.min(ny, maxY));
    this.setState({ folder: { x: nx, y: ny } });
    const trashEl = document.getElementById('sofia-os-trash');
    if (trashEl) {
      const r = trashEl.getBoundingClientRect();
      const over = ev.clientX >= r.left - 12 && ev.clientX <= r.right + 12 && ev.clientY >= r.top - 12 && ev.clientY <= r.bottom + 12;
      if (over !== this.state.trashHover) this.setState({ trashHover: over });
    }
  };

  onDragFolderUp = () => {
    document.removeEventListener('mousemove', this._onMove);
    document.removeEventListener('mouseup', this._onUp);
    if (this.state.trashHover) {
      this.setState({ folder: this._dragOrig, trashHover: false, alertOpen: true });
    } else {
      this.setState({ trashHover: false });
    }
  };

  closeAlert = () => this.setState({ alertOpen: false });





  buildItemStyle(disabled) {
    return 'display:block;width:100%;text-align:left;background:none;border:none;text-decoration:none;padding:6px 12px;font-size:14px;font-weight:600;line-height:1.3;font-family:\'Pixelify Sans\',sans-serif;cursor:' + (disabled ? 'default' : 'pointer') + ';color:' + (disabled ? '#999' : '#000') + ';';
  }

  menuBtnStyle(active) {
    return 'background:' + (active ? '#000' : 'none') + ';color:' + (active ? '#fff' : '#000') + ';border:none;font-weight:600;font-size:14px;padding:4px 12px;cursor:pointer;';
  }

  renderVals() {
    const s = this.state;
    const itemStyle = this.buildItemStyle(false);
    const itemStyleDisabled = this.buildItemStyle(true);

    const menus = [
      {
        key: 'file', label: 'File', open: s.openMenu === 'file',
        btnStyle: this.menuBtnStyle(s.openMenu === 'file'),
        toggle: () => this.toggleMenu('file'),
        items: [
          { isLink: true, sep: false, href: 'portfolio.html', label: 'Open Portfolio', itemStyle },
          { sep: true },
          { isLink: true, sep: false, href: 'assets/Sofia-Flores-Resume.pdf', target: '_blank', label: 'Open CV', itemStyle },
          { isLink: true, sep: false, href: 'assets/Sofia-Flores-Resume.pdf', download: 'Sofia-Flores-Resume.pdf', label: 'Download CV', itemStyle },
        ]
      },
      {
        key: 'work', label: 'Work', open: s.openMenu === 'work',
        btnStyle: this.menuBtnStyle(s.openMenu === 'work'),
        toggle: () => this.toggleMenu('work'),
        items: [
          { isLink: true, sep: false, label: '01  Introducing Agentic AI', href: 'case-01.html', itemStyle },
          { isLink: true, sep: false, label: '02  Expanding eSignatures Beyond the Lease', href: 'case-02.html', itemStyle },
          { isLink: true, sep: false, label: '03  Automating the Coordination, Not the Decision', href: 'case-03.html', itemStyle },
          { sep: true },
          { isLink: true, sep: false, href: 'https://sofiafloresaraujo.substack.com/?utm_campaign=profile_chips', target: '_blank', rel: 'noopener', label: 'Anthesis', itemStyle }
        ]
      },
      {
        key: 'view', label: 'View', open: s.openMenu === 'view',
        btnStyle: this.menuBtnStyle(s.openMenu === 'view'),
        toggle: () => this.toggleMenu('view'),
        items: [
          { isButton: true, sep: false, label: 'Home', action: () => this.goSection('hero-window'), itemStyle },
          { isButton: true, sep: false, label: 'Selected Work', action: () => this.goSection('selected-work'), itemStyle },
          { isButton: true, sep: false, label: 'Capabilities', action: () => this.goSection('capabilities-window'), itemStyle },
          { isButton: true, sep: false, label: 'Anthesis', action: () => this.goSection('anthesis-window'), itemStyle }
        ]
      },
      {
        key: 'window', label: 'Window', open: s.openMenu === 'window',
        btnStyle: this.menuBtnStyle(s.openMenu === 'window'),
        toggle: () => this.toggleMenu('window'),
        items: [
          { isButton: true, sep: false, label: 'Portfolio', action: this.openPortfolio, itemStyle },
          { isLink: true, sep: false, href: 'case-studies.html', label: 'Case Studies', itemStyle }
        ]
      }
    ];

    const winBase = 'position:absolute;background:#fff;border:2px solid #000;box-shadow:8px 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;';


    return {
      showWelcome: s.stage === 'welcome',
      showDesktop: s.stage === 'desktop',
      dismissWelcome: this.dismissWelcome,
      handleWelcomeKey: this.handleWelcomeKey,
      menus,
      closeMenus: this.closeMenus,
      folderX: s.folder.x,
      folderY: s.folder.y,
      startDragFolder: this.startDragFolder,
      openPortfolio: this.openPortfolio,
      trashBoxStyle: 'width:70px;height:56px;display:flex;align-items:center;justify-content:center;border:2px dashed ' + (s.trashHover ? '#000' : 'transparent') + ';',
      openTrash: this.openTrash,
      showDesktopIcons: !s.windows.portfolio.open,
      portfolioOpen: s.windows.portfolio.open,
      portfolioWinStyle: 'position:absolute;left:0;top:0;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;z-index:' + (100 + s.windows.portfolio.z) + ';',
      closePortfolio: this.closePortfolio,
      focusPortfolio: this.focusPortfolio,
      portfolioScrollRef: this.portfolioScrollRef,
      cvOpen: s.windows.cv.open,
      cvWinStyle: winBase + 'left:30%;top:80px;width:420px;height:360px;z-index:' + (100 + s.windows.cv.z) + ';',
      closeCV: this.closeCV,
      focusCV: this.focusCV,
      trashOpen: s.windows.trash.open,
      trashWinStyle: winBase + 'left:38%;top:120px;width:320px;height:240px;z-index:' + (100 + s.windows.trash.z) + ';',
      closeTrash: this.closeTrash,
      focusTrash: this.focusTrash,
      stopBubble: (e) => e.stopPropagation(),
      alertOpen: s.alertOpen,
      alertOkRef: this.alertOkRef,
      closeAlert: this.closeAlert
    };
  }
}
</script>
</body>
</html>
